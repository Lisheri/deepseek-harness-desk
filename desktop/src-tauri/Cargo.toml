[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Tauri desktop shell hosting the DeepSeek Harness web GUI; owns the dsh web server lifecycle"
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `termination` feature adds SIGTERM/SIGHUP to the handler; without it a
# SIGTERM (the macOS `kill` default) would kill the shell and orphan the server.
ctrlc = { version = "3", features = ["termination"] }

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #111318;
        color: #e6e8ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #2a2e3a;
        border-top-color: #4d6bfe;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        min-height: 1.2em;
        font-size: 14px;
        color: #8a90a0;
      }
    </style>
  </head>
  <body>
    <h1>DeepSeek Harness</h1>
    <div class="spinner"></div>
    <div id="status">正在启动 dsh web 服务…</div>
    <script>
      window.__dshDesktopStatus = (message) => {
        const el = document.getElementById("status");
        el.textContent = message;
        el.style.color = "#e05656";
      };
    </script>
  </body>
</html>
